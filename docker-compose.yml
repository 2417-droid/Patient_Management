services:
  patient-service-db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
      TZ: UTC
    volumes:
      - patient-service-db-data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d db"]
      interval: 5s
      timeout: 5s
      retries: 12

  billing-service-db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
      TZ: UTC
    volumes:
      - billing-service-db-data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d db"]
      interval: 5s
      timeout: 5s
      retries: 12

  auth-service-db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
      TZ: UTC
    volumes:
      - auth-service-db-data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d db"]
      interval: 5s
      timeout: 5s
      retries: 12

  analytics-service-db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
      TZ: UTC
    volumes:
      - analytics-service-db-data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d db"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:latest
    environment:
      CLUSTER_ID: patient-management-kafka
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    command: >-
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:9092
      --create --if-not-exists
      --topic patient
      --partitions 1
      --replication-factor 1
    networks:
      - internal
    restart: "no"

  patient-service:
    build:
      context: ./patient-service
    environment:
      SERVER_PORT: 4000
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BILLING_SERVICE_ADDRESS: billing-service
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    ports:
      - "4000:4000"
    depends_on:
      patient-service-db:
        condition: service_healthy
      billing-service:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - internal

  billing-service:
    build:
      context: ./billing-service
    environment:
      SERVER_PORT: 4001
      GRPC_SERVER_PORT: 9001
      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    ports:
      - "4001:4001"
      - "9001:9001"
    depends_on:
      billing-service-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - internal

  analytics-service:
    build:
      context: ./analytics-service
    environment:
      SERVER_PORT: 4002
      SPRING_DATASOURCE_URL: jdbc:postgresql://analytics-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    ports:
      - "4002:4002"
    depends_on:
      analytics-service-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - internal

  auth-service:
    build:
      context: ./auth-service
    environment:
      SERVER_PORT: 4005
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    ports:
      - "4005:4005"
    depends_on:
      auth-service-db:
        condition: service_healthy
    networks:
      - internal

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "4004:4004"
    depends_on:
      patient-service:
        condition: service_started
      billing-service:
        condition: service_started
      analytics-service:
        condition: service_started
      auth-service:
        condition: service_started
    networks:
      - internal

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:4004
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - internal

networks:
  internal:

volumes:
  patient-service-db-data:
  billing-service-db-data:
  auth-service-db-data:
  analytics-service-db-data:
  frontend-node-modules:
